name: Bug 报告
description: 报告 a4api 的功能异常或错误行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先[搜索现有 Issue](https://github.com/eogee/a4api/issues?q=is%3Aissue) 避免重复。
        **切勿在 Issue 中粘贴 API Key、模型密钥等敏感信息**；日志请只截取相关片段。

  - type: dropdown
    id: app-version
    attributes:
      label: a4api 版本
      description: 应用页脚或发行版页面标注的版本号
      options:
        - "其他（请在下方说明）"
        - "0.3.x"
        - "0.2.x"
        - "0.1.x"
    validations:
      required: true

  - type: checkboxes
    id: target-apps
    attributes:
      label: 目标应用
      description: 问题涉及哪些端（可多选）
      options:
        - label: Claude Code
        - label: Codex
        - label: dsh（DeepSeek Harness）
        - label: ZCode
        - label: 其他 / 不涉及特定端

  - type: input
    id: provider-model
    attributes:
      label: 服务商与模型
      description: 如 DeepSeek / deepseek-chat、智谱 GLM / glm-4.7 等
      placeholder: 例：DeepSeek / deepseek-chat
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: 复现步骤
      description: 从打开应用到出现问题：做了什么 → 实际结果 → 预期结果，越具体越好
      placeholder: |
        1. 打开 a4api，进入「…」页签
        2. 点击「…」
        3. 实际结果：…
           预期结果：…
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志片段
      description: `~/.a4api/logs/a4api.log` 中报错前后的相关片段（不要整份粘贴）。可在应用内「需求与反馈」弹窗一键生成含日志的反馈文本。
      render: text

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 报错截图、终端输出等（请确认截图中无密钥）

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，无重复
          required: true
        - label: 已确认未包含 API Key 等敏感信息
          required: true
        - label: 已尝试重启应用、确认 API Key 有效、本机可访问上游服务
          required: true
