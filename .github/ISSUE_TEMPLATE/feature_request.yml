name: 功能需求
description: 提出新功能或改进建议
title: "[需求] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提议！提交前请先[搜索现有 Issue](https://github.com/eogee/a4api/issues?q=is%3Aissue) 避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在什么场景下遇到什么问题？想让 a4api 帮你解决什么？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望的功能形态或交互方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你目前是怎么解决的？有没有其他工具能实现？

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考实现等任何有助于理解需求的内容
