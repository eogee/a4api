[project]
name = "a4api"
version = "0.1.2"
description = "Claude Code LLM API 切换工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pywebview>=5.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli_w>=1.0",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "mypy>=1.0",
    "pytest>=8.0",
    "pillow>=12.3.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
